name: Latest Irongoon Future

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irongoon-future-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SC_REPOSITORY: Legend-of-Dragoon-Modding/Severed-Chains
  SC_REF: main.spike-testing

jobs:
  sync:
    name: Rebase main.future onto main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      irongoon_sha: ${{ steps.rebase.outputs.irongoon_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release packaging and rebase safeguards
        run: python .github/scripts/test_release_tools.py
      - name: Rebase future without replacing concurrent work
        id: rebase
        env:
          MAIN_SHA: ${{ github.sha }}
          PUBLISH_FUTURE: ${{ github.event_name == 'push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/rebase_future.sh

  mod:
    name: Build main.future against target SC
    needs: sync
    if: ${{ !cancelled() && (needs.sync.result == 'success' || github.event_name != 'push') }}
    runs-on: ubuntu-latest
    outputs:
      sc_sha: ${{ steps.metadata.outputs.sc_sha }}
      version: ${{ steps.metadata.outputs.version }}
      irongoon_sha: ${{ steps.metadata.outputs.irongoon_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.irongoon_sha || 'main.future' }}
          path: irongoon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SC_REPOSITORY }}
          ref: ${{ env.SC_REF }}
          path: sc
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve build inputs
        id: metadata
        shell: bash
        run: |
          echo "sc_sha=$(git -C sc rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat .github/build-version.txt)" >> "$GITHUB_OUTPUT"
          echo "irongoon_sha=$(git -C irongoon rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build SC dependency
        working-directory: sc
        env:
          SC_SHA: ${{ steps.metadata.outputs.sc_sha }}
        # The runner supplies reserved GITHUB_* variables after YAML env values.
        run: env GITHUB_SHA="$SC_SHA" ./gradlew --no-daemon assemble -Pos=linux -Parch=x86_64
      - name: Build shaded Irongoon JAR
        env:
          SC_SHA: ${{ steps.metadata.outputs.sc_sha }}
          IRONGOON_SHA: ${{ steps.metadata.outputs.irongoon_sha }}
        run: |
          cp "sc/build/libs/lod-game-${SC_SHA}.jar" irongoon/lod-game-snapshot-2.jar
          (
            cd irongoon
            env GITHUB_SHA="$IRONGOON_SHA" java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon compileJava assemble shadowJar
          )
          python .github/scripts/package_bundles.py mod --source irongoon --jar "irongoon/build/libs/irongoon-${IRONGOON_SHA}-all.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: irongoon-v${{ steps.metadata.outputs.version }}
          path: build/bundles/irongoon-v${{ steps.metadata.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Record source revisions
        env:
          SC_SHA: ${{ steps.metadata.outputs.sc_sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
          IRONGOON_SHA: ${{ steps.metadata.outputs.irongoon_sha }}
        run: |
          {
            echo "## Latest Irongoon Future v${VERSION}"
            echo "Irongoon main.future: ${IRONGOON_SHA}"
            echo "Triggered by main: ${GITHUB_SHA}"
            echo "SC: ${SC_REPOSITORY}@${SC_SHA} (resolved from ${SC_REF})"
            echo "Standalone ZIP: extract into an existing SC mods directory."
          } >> "$GITHUB_STEP_SUMMARY"

  platforms:
    name: Bundle ${{ matrix.platform }}
    needs: mod
    if: ${{ !cancelled() && needs.mod.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, os: windows, arch: x86_64, steamdeck: 'false' }
          - { platform: Steam_Deck, os: linux, arch: x86_64, steamdeck: 'true' }
          - { platform: Linux, os: linux, arch: x86_64, steamdeck: 'false' }
          - { platform: Linux_ARM64, os: linux, arch: aarch64, steamdeck: 'false' }
          - { platform: MacOS_Intel, os: osx, arch: x86_64, steamdeck: 'false' }
          - { platform: MacOS_M1, os: osx, arch: aarch64, steamdeck: 'false' }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SC_REPOSITORY }}
          ref: ${{ needs.mod.outputs.sc_sha }}
          path: sc
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: irongoon-v${{ needs.mod.outputs.version }}
          path: build/bundles
      - name: Stamp SC build metadata
        run: python .github/scripts/package_bundles.py stamp --sc sc --sha "${{ needs.mod.outputs.sc_sha }}" --build "${{ github.run_number }}"
      - name: Build SC platform distribution
        working-directory: sc
        env:
          SC_SHA: ${{ needs.mod.outputs.sc_sha }}
        run: env GITHUB_SHA="$SC_SHA" ./gradlew --no-daemon assemble -Pos=${{ matrix.os }} -Parch=${{ matrix.arch }} -Psteamdeck=${{ matrix.steamdeck }}
      - name: Package and verify bundle
        run: python .github/scripts/package_bundles.py bundle --sc sc --sha "${{ needs.mod.outputs.sc_sha }}" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sc-modified-irongoon-${{ matrix.platform }}
          path: build/bundles/sc-modified-irongoon-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Update future prerelease
    needs: [mod, platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.mod.outputs.version }}
          SC_SHA: ${{ needs.mod.outputs.sc_sha }}
          RELEASE_TAG: irongoon-future
          RELEASE_TITLE: Latest Irongoon Future
          RELEASE_SHA: ${{ needs.mod.outputs.irongoon_sha }}
          BUNDLE_DIR: bundles
          ASSET_COUNT: '7'
          NOTES_FILE: notes.md
        shell: bash
        run: |
          cat > notes.md <<EOF
          Automated Irongoon v${VERSION} future build from main.future commit ${RELEASE_SHA}.

          Triggered by main commit ${GITHUB_SHA}, after rebasing main.future onto main.

          SC source: ${SC_REPOSITORY}@${SC_SHA} (${SC_REF}).

          Download the sc-modified-irongoon ZIP for your platform and extract it into a new directory. Supply your own disc images in isos. Irongoon is already installed under mods.

          For an existing SC installation, extract irongoon-v${VERSION}.zip into mods, replacing the previous Irongoon JAR. Back up your configuration before replacing the irongoon folder.

          SC's standard JDK setup and upstream development updater remain enabled. An SC update can replace spike-testing engine changes; it preserves mods but does not update Irongoon.

          These assets are replaced after successful main builds. Manual version-tag releases remain separate.
          EOF
          bash .github/scripts/publish_prerelease.sh
