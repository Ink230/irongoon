buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.2.2'
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'com.gradleup.shadow'

project.ext.hash = System.getenv("GITHUB_SHA");

if(project.ext.hash == null) {
  project.ext.hash = 'snapshot'
}

group 'legend'
version project.ext.hash

java {
  sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

compileJava.options.encoding = 'UTF-8'

repositories {
  mavenCentral()
  mavenLocal()
  maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
  maven { url = "https://jitpack.io" }
}

configurations {
    irongoonShadow
    implementation.extendsFrom(irongoonShadow)
    // Tests run outside SC and need its provided libraries at runtime.
    testImplementation.extendsFrom(compileOnly)
}

dependencies {
    // SC supplies the engine and these libraries when it loads the mod.
    compileOnly files("$projectDir/lod-game-snapshot-2.jar")
    compileOnly 'org.legendofdragoon:mod-loader:4.3.3'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    compileOnly 'com.opencsv:opencsv:5.9'
    compileOnly 'com.github.slugify:slugify:3.0.7'
    compileOnly 'it.unimi.dsi:fastutil:8.5.15'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    irongoonShadow 'org.yaml:snakeyaml:2.2'

  testImplementation(platform("org.junit:junit-bom:6.0.0"))
  testImplementation("org.junit.jupiter:junit-jupiter")
  testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.register('sourceJar', Jar) {
  from sourceSets.main.allJava
  archiveClassifier = "sources"
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = 'lod'
      from components.java
      pom {
        name = 'LoD Engine'
      }

      artifact sourceJar
    }
  }
}

test {
    useJUnitPlatform()
}

sourceSets {
  main {
    java {
      srcDirs = ["src/main/java"]
      exclude ".gradle", "build", "files"
    }
  }
}

processResources {
  from("mods/irongoon/irongoon-data") {
    include "scdk-addition-stats.csv"
    include "scdk-addition-unlock-levels.csv"
    include "scdk-character-stats.csv"
    include "scdk-dragoon-stats.csv"
    include "scdk-monster-stats.csv"
    into "irongoon-data"
  }
}

shadowJar {
    configurations = [project.configurations.irongoonShadow]
    // Irongoon uses the standard YAML constructor; these optional constructors are unused.
    exclude 'org/yaml/snakeyaml/env/**',
            'org/yaml/snakeyaml/extensions/**',
            'org/yaml/snakeyaml/constructor/CustomClassLoaderConstructor.class',
            'org/yaml/snakeyaml/error/MissingEnvironmentVariableException.class'
}
